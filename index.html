"], "d": "HARD"}, {"q": "キャプテン・マーベルの力に関係した石は？", "a": "スペース・ストーン", "o": ["スペース・ストーン", "タイム・ストーン", "ソウル・ストーン", "マインド・ストーン"], "d": "NORMAL"}, {"q": "『マーベルズ』でキャプテン・マーベルと共闘する2人は？", "a": "モニカ・ランボーとカマラ・カーン", "o": ["モニカ・ランボーとカマラ・カーン", "ワンダとエレーナ", "シュリとケイト", "ホープとケイト"], "d": "NORMAL"}, {"q": "『アガサ・オール・アロング』で魔女たちが進む道は？", "a": "魔女の道", "o": ["魔女の道", "魔女の輪", "暗黒街道", "セイラムの道"], "d": "EASY"}, {"q": "『デッドプール＆ウルヴァリン』で時間を管理する組織は？", "a": "TVA", "o": ["TVA", "S.H.I.E.L.D.", "HYDRA", "A.I.M."], "d": "EASY"}, {"q": "『デッドプール＆ウルヴァリン』のデッドプールの本名は？", "a": "ウェイド・ウィルソン", "o": ["ウェイド・ウィルソン", "ローガン", "サム・ウィルソン", "ジェームズ・ローズ"], "d": "EASY"}];
const KEY="marvelTimeShockMyQuestionsV2",TOTAL=10;
let mine=JSON.parse(localStorage.getItem(KEY)||"[]");
let pool=[],i=0,score=0,streak=0,correct=0,maxStreak=0,timer=null,locked=false;
let mode="solo",player=1,results=[],startAt=0,firstQuestion=true;

const $=x=>document.getElementById(x);

function render(){
  $("count").textContent=BUILTIN.length+"問内蔵";
  $("myCount").textContent=mine.length+"問";
}
function save(){
  localStorage.setItem(KEY,JSON.stringify(mine));
  render();
}
function toggleAdd(){$("add").classList.toggle("hidden")}
function add(){
  const q=$("q").value.trim();
  const a=$("a").value.trim();
  const o=$("o").value.split(",").map(x=>x.trim()).filter(Boolean);
  if(!q||!a||o.length<3){
    $("status").textContent="問題文・正解・不正解3つを入力してください";
    $("status").classList.remove("hidden");
    return;
  }
  mine.push({q,a,o:[a,...o.slice(0,3)],d:"NORMAL"});
  save();
  $("q").value=$("a").value=$("o").value="";
  $("status").textContent="登録しました";
  $("status").classList.remove("hidden");
}
function home(){
  clearInterval(timer);
  $("countdown").classList.add("hidden");
  $("home").classList.remove("hidden");
  $("game").classList.add("hidden");
  $("result").classList.add("hidden");
}
function start(m){
  mode=m;
  player=1;
  results=[];
  firstQuestion=true;
  round();
}
function round(){
  pool=[...BUILTIN,...mine]
    .filter(x=>mode==="easy"?x.d!=="HARD":mode==="hard"?x.d!=="EASY":true)
    .sort(()=>Math.random()-.5)
    .slice(0,TOTAL);

  i=0;score=0;streak=0;correct=0;maxStreak=0;
  $("home").classList.add("hidden");
  $("result").classList.add("hidden");
  $("game").classList.remove("hidden");
  $("player").textContent=mode==="battle"?"PLAYER "+player:"MARVEL CHALLENGER";
  next();
}
function next(){
  if(i>=TOTAL){finish();return;}

  locked=true;
  const x=pool[i];

  $("qn").textContent=(i+1)+" / "+TOTAL;
  $("score").textContent=score;
  $("streak").textContent=streak;
  $("elapsed").textContent="0.0s";
  $("timer").textContent="5.0";
  $("bar").style.width="100%";
  $("difficulty").textContent=x.d+" / 5 SEC";
  $("question").textContent=x.q;

  const choices=[...x.o].sort(()=>Math.random()-.5);
  $("choices").innerHTML=choices.map(v=>`<button class="choice" disabled>${esc(v)}</button>`).join("");
  [...$("choices").children].forEach(b=>b.onclick=()=>answer(b,x));

  if(firstQuestion){
    firstQuestion=false;
    countdownThenStart();
  }else{
    // 2問目以降はカウントダウンなしで即スタート
    [...$("choices").children].forEach(b=>b.disabled=false);
    startTimer();
  }
}
function countdownThenStart(){
  clearInterval(timer);
  const el=$("countdown");
  el.className="countdown";
  el.classList.remove("hidden");

  let n=3;
  el.textContent=n;

  const tick=()=>{
    n--;
    if(n>0){
      el.textContent=n;
      setTimeout(tick,650);
    }else{
      el.textContent="START!";
      el.classList.add("go");
      setTimeout(()=>{
        el.classList.add("hidden");
        el.classList.remove("go");

        // ここで初めて回答を受け付ける
        locked=false;
        [...$("choices").children].forEach(b=>b.disabled=false);
        startTimer();
      },450);
    }
  };
  setTimeout(tick,650);
}
function esc(s){
  return String(s).replace(/[&<>"']/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[m]));
}
function startTimer(){
  clearInterval(timer);
  startAt=performance.now();
  const end=startAt+5000;

  timer=setInterval(()=>{
    const r=Math.max(0,end-performance.now());
    const sec=Math.min(5,(performance.now()-startAt)/1000);

    $("timer").textContent=(r/1000).toFixed(1);
    $("elapsed").textContent=sec.toFixed(1)+"s";
    $("bar").style.width=(r/50)+"%";

    if(r<=0){
      clearInterval(timer);
      timeout();
    }
  },50);
}
function timeout(){
  if(locked) return;
  locked=true;
  clearInterval(timer);
  streak=0;
  $("timer").textContent="TIME!";
  [...$("choices").children].forEach(b=>b.disabled=true);
  setTimeout(()=>{
    i++;
    next();
  },700);
}
function answer(btn,x){
  if(locked) return;

  locked=true;
  clearInterval(timer);

  const sec=Math.min(5,Math.max(0,(performance.now()-startAt)/1000));
  const ok=btn.textContent===x.a;

  if(ok){
    correct++;
    streak++;
    maxStreak=Math.max(maxStreak,streak);

    const base=100;
    const speed=Math.round((5-sec)*20);
    const streakBonus=Math.max(0,streak-1)*25;
    score+=base+speed+streakBonus;

    btn.classList.add("correct");
    $("timer").textContent="CORRECT!";
  }else{
    streak=0;
    btn.classList.add("wrong");
    const correctBtn=[...$("choices").children].find(b=>b.textContent===x.a);
    if(correctBtn) correctBtn.classList.add("correct");
    $("timer").textContent="WRONG";
  }

  [...$("choices").children].forEach(b=>b.disabled=true);
  $("score").textContent=score;
  $("streak").textContent=streak;

  setTimeout(()=>{
    i++;
    next();
  },700);
}
function finish(){
  clearInterval(timer);
  results.push({score,correct});

  if(mode==="battle"&&player===1){
    player=2;
    setTimeout(round,700);
    return;
  }

  $("game").classList.add("hidden");
  $("result").classList.remove("hidden");

  if(mode==="battle"){
    const a=results[0],b=results[1];
    const w=a.score===b.score?"DRAW":a.score>b.score?"PLAYER 1":"PLAYER 2";
    $("resultTitle").textContent=w==="DRAW"?"DRAW!":w+" WIN!";
    $("resultScore").textContent=a.score+" vs "+b.score;
    $("resultDetail").innerHTML=
      `PLAYER 1：${a.correct}/${TOTAL} 正解（${a.score}点）<br>`+
      `PLAYER 2：${b.correct}/${TOTAL} 正解（${b.score}点）`;
  }else{
    $("resultTitle").textContent="RESULT";
    $("resultScore").textContent=score;
    $("resultDetail").innerHTML=
      `${correct}/${TOTAL} 正解<br>最高連続正解：${maxStreak}`;
  }
}
render();
</script></body></html>
