<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>TIME SHOCK!</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#050505;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
body{display:flex;justify-content:center}
button,input,textarea{font:inherit}
.app{width:min(100%,900px);min-height:100vh;padding:20px 16px 32px}
.hidden{display:none!important}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.logo{font-weight:900;letter-spacing:.12em;font-size:clamp(22px,5vw,38px);font-style:italic}
.badge{font-size:12px;border:1px solid #555;border-radius:999px;padding:5px 10px;color:#bbb}
.card{background:#101010;border:1px solid #292929;border-radius:18px;padding:22px;box-shadow:0 15px 45px #000}
h1,h2,p{margin-top:0}
h1{font-size:clamp(32px,9vw,72px);margin-bottom:8px;letter-spacing:.05em;font-style:italic;text-align:center}
.subtitle{text-align:center;color:#aaa;margin-bottom:28px}
.btn{border:0;border-radius:12px;padding:13px 18px;background:#fff;color:#000;font-weight:800;cursor:pointer;transition:.15s;min-height:48px}
.btn:hover{transform:translateY(-1px)}
.btn.secondary{background:#202020;color:#fff;border:1px solid #3a3a3a}
.btn.danger{background:#5c1515;color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.settings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:18px 0}
.setting{background:#171717;border-radius:12px;padding:14px}
.setting strong{display:block;font-size:22px;margin-top:3px}
label{display:block;color:#aaa;font-size:13px;margin-bottom:6px}
input,textarea{width:100%;background:#090909;color:#fff;border:1px solid #444;border-radius:9px;padding:10px;outline:none}
textarea{min-height:78px;resize:vertical}
.question-screen{min-height:calc(100vh - 80px);display:flex;flex-direction:column}
.progress{display:flex;justify-content:space-between;color:#aaa;font-size:14px;margin-bottom:10px}
.timer-wrap{height:12px;background:#222;border-radius:999px;overflow:hidden;margin-bottom:22px}
.timer{height:100%;width:100%;background:#fff;transform-origin:left center}
.timer.danger{background:#e33}
.qbox{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px 0}
.qtext{font-size:clamp(28px,6vw,52px);font-weight:800;line-height:1.35;max-width:820px;margin-bottom:30px}
.answer-row{display:flex;gap:10px;width:min(680px,100%);margin:auto}
.answer-row input{font-size:22px;text-align:center;height:58px}
.feedback{min-height:48px;text-align:center;font-weight:800;font-size:20px;margin-top:14px}
.feedback.ok{color:#7cff9b}.feedback.ng{color:#ff6868}
.countdown{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:10}
.count-number{font-size:clamp(90px,30vw,260px);font-weight:1000;font-style:italic}
.flash{animation:flash .45s}
@keyframes flash{50%{filter:brightness(3)}}
.shock{font-size:clamp(44px,12vw,110px);font-weight:1000;font-style:italic;letter-spacing:.03em;text-align:center;animation:shock .8s}
@keyframes shock{0%{transform:scale(.4) rotate(-8deg);opacity:0}60%{transform:scale(1.08) rotate(2deg)}100%{transform:scale(1);opacity:1}}
.score{font-size:clamp(70px,20vw,150px);font-weight:1000;text-align:center;line-height:1}
.big{font-size:22px;text-align:center}
.result-list{max-height:300px;overflow:auto;margin:20px 0}
.result-item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #292929}
.admin-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.form-grid{display:grid;gap:12px}
.question-list{margin-top:18px;display:grid;gap:8px}
.qitem{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px;background:#171717;border-radius:10px}
.qitem small{color:#aaa}
@media(max-width:600px){
 .app{padding:14px 12px 24px}.card{padding:16px;border-radius:14px}.settings{grid-template-columns:1fr}
 .answer-row{flex-direction:column}.answer-row .btn{width:100%}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="logo">TIME SHOCK!</div>
    <div class="badge">10 QUESTIONS / 5 SEC</div>
  </div>

  <section id="home" class="card">
    <h1>TIME SHOCK!</h1>
    <p class="subtitle">5秒以内に答えろ。10問連続正解を目指せ！</p>
    <div class="settings">
      <div class="setting"><label>問題数</label><strong>10問</strong></div>
      <div class="setting"><label>制限時間</label><strong>5秒 / 問</strong></div>
    </div>
    <div class="actions">
      <button class="btn" id="startBtn">GAME START</button>
      <button class="btn secondary" id="manageBtn">問題を登録・管理</button>
    </div>
  </section>

  <section id="admin" class="card hidden">
    <div class="admin-head">
      <h2>問題登録</h2>
      <button class="btn secondary" id="backHomeBtn">戻る</button>
    </div>
    <div class="form-grid">
      <div><label>問題文</label><textarea id="questionInput" placeholder="例：日本の首都は？"></textarea></div>
      <div><label>正解（入力文字列と完全一致ではなく、空白・大小文字などを整えて比較します）</label><input id="answerInput" placeholder="例：東京"></div>
      <div class="actions" style="justify-content:flex-start">
        <button class="btn" id="addBtn">問題を追加</button>
        <button class="btn secondary" id="sampleBtn">サンプル問題を追加</button>
        <button class="btn danger" id="clearBtn">全削除</button>
      </div>
    </div>
    <div id="questionList" class="question-list"></div>
  </section>

  <section id="game" class="question-screen hidden">
    <div class="progress"><span id="progressText">1 / 10</span><span id="scoreText">SCORE 0</span></div>
    <div class="timer-wrap"><div id="timerBar" class="timer"></div></div>
    <div class="qbox">
      <div id="questionText" class="qtext"></div>
      <div class="answer-row">
        <input id="answerBox" autocomplete="off" autocapitalize="off" placeholder="答えを入力">
        <button class="btn" id="answerBtn">ANSWER</button>
      </div>
      <div id="feedback" class="feedback"></div>
    </div>
  </section>

  <section id="result" class="card hidden">
    <div id="shockTitle" class="shock">TIME SHOCK!</div>
    <p class="big" id="resultMessage"></p>
    <div id="finalScore" class="score">0 / 10</div>
    <div id="resultList" class="result-list"></div>
    <div class="actions">
      <button class="btn" id="againBtn">もう一度</button>
      <button class="btn secondary" id="resultHomeBtn">ホームへ</button>
    </div>
  </section>
</div>

<div id="countdown" class="countdown hidden"><div id="countNumber" class="count-number">3</div></div>

<script>
const KEY="timeShockQuestionsV1";
const defaultQuestions=[
 {q:"日本の首都は？",a:"東京"},
 {q:"1年は何か月？",a:"12"},
 {q:"富士山の標高は約何m？",a:"3776"},
 {q:"日本で一番大きい都道府県は？",a:"北海道"},
 {q:"英語で「猫」は？",a:"cat"},
 {q:"太陽系で地球のひとつ外側を回る惑星は？",a:"火星"},
 {q:"水の化学式は？",a:"H2O"},
 {q:"7×8は？",a:"56"},
 {q:"日本の国鳥は？",a:"キジ"},
 {q:"「吾輩は猫である」の作者は？",a:"夏目漱石"},
 {q:"大阪府の府庁所在地は？",a:"大阪市"},
 {q:"虹は通常何色とされる？",a:"7"},
 {q:"世界で最も面積が大きい国は？",a:"ロシア"},
 {q:"地球が太陽の周りを1周するのに約何日？",a:"365"},
 {q:"「ありがとう」を英語で？",a:"thank you"}
];

let questions=loadQuestions();
let gameQuestions=[], current=0, score=0, answered=false, timerId=null, startTime=0, results=[];
const $=id=>document.getElementById(id);
function loadQuestions(){try{const x=JSON.parse(localStorage.getItem(KEY));return Array.isArray(x)&&x.length?x:defaultQuestions.slice()}catch{return defaultQuestions.slice()}}
function saveQuestions(){localStorage.setItem(KEY,JSON.stringify(questions))}
function show(id){["home","admin","game","result"].forEach(x=>$(x).classList.toggle("hidden",x!==id))}
function normalize(s){return String(s??"").trim().toLowerCase().replace(/[ 　]/g,"").replace(/[。、！？!?.,]/g,"")}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function beep(freq,duration,type="sine",volume=.06){
  try{const C=window.AudioContext||window.webkitAudioContext; if(!C)return;
    const ctx=new C(),o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=freq;
    g.gain.setValueAtTime(volume,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+duration);
    o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+duration);
  }catch(e){}
}
function correctSound(){beep(880,.12,"sine",.07);setTimeout(()=>beep(1320,.16,"sine",.07),80)}
function wrongSound(){beep(180,.25,"sawtooth",.05)}
function timeoutSound(){beep(120,.4,"square",.05)}

function renderQuestions(){
  const list=$("questionList"); list.innerHTML="";
  questions.forEach((x,i)=>{
    const d=document.createElement("div");d.className="qitem";
    d.innerHTML=`<div><div>${escapeHtml(x.q)}</div><small>正解：${escapeHtml(x.a)}</small></div><button class="btn danger" data-i="${i}" style="min-height:40px;padding:8px 12px">削除</button>`;
    list.appendChild(d);
  });
  list.querySelectorAll("button").forEach(b=>b.onclick=()=>{questions.splice(+b.dataset.i,1);saveQuestions();renderQuestions()});
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}

$("manageBtn").onclick=()=>{show("admin");renderQuestions()}
$("backHomeBtn").onclick=()=>show("home")
$("addBtn").onclick=()=>{
 const q=$("questionInput").value.trim(),a=$("answerInput").value.trim();
 if(!q||!a){alert("問題文と正解を入力してください。");return}
 questions.push({q,a});saveQuestions();$("questionInput").value="";$("answerInput").value="";renderQuestions()
}
$("sampleBtn").onclick=()=>{questions.push(...defaultQuestions);saveQuestions();renderQuestions()}
$("clearBtn").onclick=()=>{if(confirm("登録した問題をすべて削除しますか？")){questions=[];saveQuestions();renderQuestions()}}
$("startBtn").onclick=startGame
$("againBtn").onclick=startGame
$("resultHomeBtn").onclick=()=>show("home")

async function startGame(){
 if(questions.length<10){alert("ゲームには10問以上の問題が必要です。問題を10問以上登録してください。");return}
 show("home");$("countdown").classList.remove("hidden");
 for(let n=3;n>=1;n--){$("countNumber").textContent=n;beep(n===1?880:660,.13);await wait(700)}
 $("countNumber").textContent="GO!";beep(1200,.2);await wait(450);$("countdown").classList.add("hidden");
 gameQuestions=shuffle(questions).slice(0,10);current=0;score=0;results=[];show("game");nextQuestion()
}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
function nextQuestion(){
 if(current>=10){finishGame();return}
 answered=false;$("feedback").textContent="";$("feedback").className="feedback";
 $("progressText").textContent=`${current+1} / 10`;$("scoreText").textContent=`SCORE ${score}`;
 $("questionText").textContent=gameQuestions[current].q;
 $("answerBox").value="";$("answerBox").disabled=false;$("answerBtn").disabled=false;
 $("answerBox").focus();startTimer()
}
function startTimer(){
 clearInterval(timerId);startTime=performance.now();$("timerBar").classList.remove("danger");
 timerId=setInterval(()=>{
  const elapsed=performance.now()-startTime,ratio=Math.max(0,1-elapsed/5000);
  $("timerBar").style.width=(ratio*100)+"%";
  if(ratio<.3)$("timerBar").classList.add("danger");
  if(ratio<=0){clearInterval(timerId);submitAnswer(true)}
 },30)
}
function submitAnswer(timeout=false){
 if(answered)return;answered=true;clearInterval(timerId);
 const item=gameQuestions[current], user=$("answerBox").value.trim();
 const ok=!timeout && normalize(user)===normalize(item.a);
 results.push({q:item.q,user:user||"（時間切れ）",a:item.a,ok});
 $("answerBox").disabled=true;$("answerBtn").disabled=true;
 if(ok){score++;$("feedback").textContent="CORRECT!";$("feedback").className="feedback ok";correctSound()}
 else{$("feedback").textContent=timeout?"TIME OUT!":"INCORRECT!";$("feedback").className="feedback ng";timeout?timeoutSound():wrongSound()}
 $("scoreText").textContent=`SCORE ${score}`;
 setTimeout(()=>{current++;nextQuestion()},650)
}
$("answerBtn").onclick=()=>submitAnswer(false)
$("answerBox").addEventListener("keydown",e=>{if(e.key==="Enter")submitAnswer(false)})

function finishGame(){
 clearInterval(timerId);show("result");
 $("finalScore").textContent=`${score} / 10`;
 $("resultMessage").textContent=score===10?"PERFECT! 全問正解！":score>=7?"GREAT! かなりの好成績！":score>=4?"GOOD! もう一度挑戦！":"KEEP TRYING!";
 $("resultList").innerHTML=results.map((r,i)=>`<div class="result-item"><span>${i+1}. ${escapeHtml(r.q)}<br><small>回答：${escapeHtml(r.user)} / 正解：${escapeHtml(r.a)}</small></span><b>${r.ok?"○":"×"}</b></div>`).join("");
 if(score===10){beep(880,.12);setTimeout(()=>beep(1100,.12),130);setTimeout(()=>beep(1320,.25),260)}
}
renderQuestions();
</script>
</body>
</html>
